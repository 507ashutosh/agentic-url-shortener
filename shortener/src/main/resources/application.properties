spring.application.name=shortener
server.port=8080

# In-memory H2. The schema is owned by schema.sql, not generated by Hibernate,
# so every schema change is an explicit, reviewable file change.
spring.datasource.url=jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health check only; nothing else is exposed.
management.endpoints.web.exposure.include=health

# Public address used to build the short link returned to the caller.
shortener.base-url=http://localhost:8080
# POST /shorten requests allowed per client IP per window.
shortener.rate-limit.requests=20
shortener.rate-limit.window=1m
